name: Daily AI reports

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai.
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: daily-ai-reports
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            openpyxl==3.1.5 \
            requests==2.32.3 \
            pymupdf==1.26.4 \
            feedparser==6.0.11

      - name: Generate, check, and send reports
        env:
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
        run: python daily_runner.py --hours 24 --send

      - name: Persist daily state
        shell: bash
        run: |
          set -euo pipefail
          state_files=(
            papers_record.xlsx
            crawled_ids.txt
            pending_llm_ids.txt
            new_papers.json
            news_items.json
            news_seen.txt
            quality_review.json
            viewer/papers_data.json
          )
          for path in "${state_files[@]}"; do
            if [[ -f "$path" ]]; then
              git add -f -- "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No daily state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily AI report state"
          git push
